name: Connect Biopharma
description: Connect Biopharma is a clinical-stage biopharmaceutical company headquartered in San
  Diego, California, dedicated to transforming care for patients with inflammatory diseases such as
  asthma and COPD. Its lead drug candidate, rademikibart (CBP-201), is an antibody targeting IL-4Ra
  in Phase 2 clinical development for acute asthma and COPD exacerbations. Surfaced as a portfolio
  company of the venture firm Qiming and added to the API Evangelist network, the company operates in
  the pharmaceutical and biotechnology sector and publishes no public developer portal, API, or
  technical documentation.
